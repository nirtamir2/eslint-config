name: Publish Any Commit
on: [push, pull_request]

jobs:
  build:
    if: ${{ !startsWith(github.head_ref, 'codex/upstream-') && !startsWith(github.ref_name, 'codex/upstream-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # corepack bug requires me to add `npm i -g --force corepack &&` before `corepack enable`
      # @see https://github.com/actions/setup-node/issues/1222#issuecomment-2631024706
      - run: npm i -g --force corepack && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check generated Oxlint config
        run: pnpm check:oxlint-generated

      - name: Build
        run: pnpm build

      - name: Test packed Oxlint entry
        run: pnpm test:oxlint-package

      - run: pnpm exec pkg-pr-new publish --pnpm
